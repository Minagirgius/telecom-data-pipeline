
network_events:
  required_fields:
    - event_id
    - tower_id
    - event_timestamp
    - ingestion_timestamp

  valid_statuses:
    - NORMAL
    - DEGRADED
    - DOWN

  hard_limits:
    signal_strength_dbm:
      min: -150
      max: 0
    call_drop_rate:
      min: 0
      max: 100
    latency_ms:
      min: 0
    download_speed_mbps:
      min: 0
    upload_speed_mbps:
      min: 0
    packet_loss_pct:
      min: 0
      max: 100

  normal_thresholds:
    signal_strength_dbm:
      min: -95
      max: -65
    call_drop_rate:
      max: 3.5
    latency_ms:
      max: 95
    download_speed_mbps:
      min: 25
    upload_speed_mbps:
      min: 8
    packet_loss_pct:
      max: 1.5

  late_arrival:
    threshold_minutes: 60
    action: flag

  missing_metrics:
    action: flag

  extreme_metrics:
    action: flag

  status_mismatch:
    action: flag
